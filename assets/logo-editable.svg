<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1094 700" width="1094" height="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- speech bubble: 340x305, corner r=95, tail bottom-left -->
    <path id="bubble" d="M0 95 L0 210 C0 248 20 258 20 275 L18 308 C16 322 13 334 7 343 C33 343 63 330 88 305 L245 305 A95 95 0 0 0 340 210 L340 95 A95 95 0 0 0 245 0 L95 0 A95 95 0 0 0 0 95 Z"/>
    <!-- 20px gap around the front bubble, cut out of the back bubble -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1094" height="700">
      <rect width="1094" height="700" fill="#fff"/>
      <use xlink:href="#bubble" transform="translate(317 111)" fill="#000" stroke="#000" stroke-width="40" stroke-linejoin="round"/>
    </mask>
    <!-- eyes + smile cut out of the front bubble -->
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="1094" height="700">
      <rect width="1094" height="700" fill="#fff"/>
      <rect x="396" y="199" width="35" height="71" rx="17.5" fill="#000"/>
      <rect x="543" y="199" width="35" height="71" rx="17.5" fill="#000"/>
      <path d="M456 306 Q487 325 518 306" fill="none" stroke="#000" stroke-width="17" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- back bubble (mirrored, tail bottom-right) -->
  <g mask="url(#gap)">
    <use xlink:href="#bubble" transform="translate(777 40) scale(-1 1)" fill="#8870FC"/>
  </g>
  <!-- front bubble -->
  <g mask="url(#face)">
    <use xlink:href="#bubble" transform="translate(317 111)" fill="#0E142D"/>
  </g>

  <text x="547" y="629" text-anchor="middle" font-family="'Avenir Next', Avenir, sans-serif" font-weight="700" font-size="185" fill="#0E142D">Understudy</text>
</svg>
