display_information:
  name: Workspace Agent
  description: Ask a coworker's read-only Claude about the code on their machine.
  background_color: "#0e7c86"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Workspace Agent
    always_online: false
  slash_commands:
    - command: /ask
      description: Ask a coworker's agent a question
      usage_hint: "jane where does token refresh happen?"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:write
      - channels:history
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
