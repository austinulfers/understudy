name: Release macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never cancel a run mid-upload; a half-published release is worse than a queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # arm64 runner. The app only targets mac arm64 (see packages/app/package.json -> build.mac.target).
    runs-on: macos-14
    # Two notarization passes (app, then DMG). Usually a few minutes total, but
    # Apple's queue is unpredictable — a first submission once took 85 minutes.
    # Generous ceiling so a slow day at Apple doesn't kill an otherwise good run.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node so that `cache: pnpm` can find the store.
      # No `version:` input — it reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fail before the long build rather than after, and name exactly what is
      # missing. Signing is not optional: an unsigned build will not launch on
      # anyone else's Mac, so there is no useful degraded mode to fall back to.
      #
      # Named after the secrets, not the env vars they later map to, so the
      # error message says something you can act on in the settings UI.
      - name: Preflight — check signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets for code signing: ${missing[*]}. See docs/RELEASING.md for how to create and set them."
            exit 1
          fi
          echo "All signing secrets present."

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Resolve version
        id: meta
        run: |
          version=$(node -p "require('./packages/app/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Check whether this version was already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists — building to verify, but not publishing. Bump the version in packages/app/package.json to cut a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # @electron/notarize wants a *path* to the .p8, not its contents. The same
      # file is reused for the DMG pass, so it is shredded at the end, not here.
      - name: Stage App Store Connect API key
        id: asc
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize the app
        env:
          # electron-builder imports this into a throwaway keychain itself, then
          # deletes it — which is why the DMG step below builds its own.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Presence of these three is what switches notarization on.
          APPLE_API_KEY: ${{ steps.asc.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm --filter understudy-app build
          # `publish` in the build config names the GitHub repo the app's updater
          # reads from and makes electron-builder write latest-mac.yml. Uploading
          # is this workflow's own job (the last step), hence --publish never.
          pnpm --filter understudy-app exec electron-builder --mac --publish never

      # electron-builder notarizes and staples the .app, then builds the DMG from
      # it — but leaves the DMG itself unsigned. The DMG is what people actually
      # download, and Gatekeeper assesses it on mount, so it needs the same
      # treatment. Apple's guidance is to notarize the distributed container.
      - name: Sign, notarize, and staple the DMG
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ steps.asc.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(packages/app/release/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected exactly one .dmg, found ${#dmgs[@]}"; exit 1
          fi
          dmg="${dmgs[0]}"

          keychain="$RUNNER_TEMP/dmg-signing.keychain-db"
          kc_pass=$(openssl rand -base64 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          # Trust evaluation only consults keychains on the search list. Without
          # this, a perfectly good cert yields CSSMERR_TP_NOT_TRUSTED and codesign
          # dies with errSecInternalComponent.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d ' "')

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported .p12"; exit 1
          fi
          echo "Signing DMG with $identity"
          codesign --sign "$identity" --timestamp --keychain "$keychain" --force "$dmg"

          echo "Submitting DMG to Apple. This takes a while — the app is large."
          out=$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json)
          echo "$out"
          status=$(printf '%s' "$out" | jq -r .status)
          id=$(printf '%s' "$out" | jq -r .id)
          if [ "$status" != "Accepted" ]; then
            echo "::error::DMG notarization returned $status"
            xcrun notarytool log "$id" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi

          xcrun stapler staple "$dmg"

      # electron-builder hashed the DMG before the step above rewrote it. The
      # updater only ever fetches the zip, but the manifest is published, so it
      # must not lie about the DMG it lists.
      - name: Refresh the update manifest
        run: node packages/app/scripts/update-manifest.mjs packages/app/release/latest-mac.yml

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/dmg-signing.keychain-db" 2>/dev/null || true

      # Catches the failure mode where the build "succeeds" but produces
      # something Gatekeeper will still reject on a user's machine.
      - name: Verify the app, the DMG, and the update zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="packages/app/release/mac-arm64/Understudy.app"
          dmgs=(packages/app/release/*.dmg); dmg="${dmgs[0]}"
          zips=(packages/app/release/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected exactly one .zip, found ${#zips[@]}"; exit 1
          fi
          zip="${zips[0]}"

          echo "::group::app — signature, entitlements, authority"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags="
          codesign -d --entitlements :- "$app"
          echo "::endgroup::"

          # Hardened runtime must be on, or notarization would not have passed.
          codesign -dvvv "$app" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime is not enabled on the signed app"; exit 1; }

          # The stapled ticket is what lets it launch on a Mac that has never seen
          # it before, even offline. Without it users still get blocked.
          echo "::group::app — stapled ticket and Gatekeeper"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          echo "::endgroup::"

          # Same again for the container people actually download.
          echo "::group::dmg — signature, stapled ticket, Gatekeeper"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          echo "::endgroup::"

          # The zip is what installed copies download to update. Squirrel.Mac
          # judges the app that comes out of it, so check exactly that.
          echo "::group::zip — the app inside is signed, stapled, and Gatekeeper-clean"
          unzipped="$RUNNER_TEMP/zip-check"
          rm -rf "$unzipped" && mkdir -p "$unzipped"
          ditto -x -k "$zip" "$unzipped"
          codesign --verify --deep --strict --verbose=2 "$unzipped/Understudy.app"
          xcrun stapler validate "$unzipped/Understudy.app"
          spctl --assess --type execute --verbose=4 "$unzipped/Understudy.app"
          echo "::endgroup::"

          # electron-updater refuses a download whose sha512 disagrees with the manifest.
          echo "::group::manifest — latest-mac.yml matches the files being published"
          node packages/app/scripts/update-manifest.mjs packages/app/release/latest-mac.yml --check
          echo "::endgroup::"

          echo "App, DMG, and update zip are signed, notarized, and stapled; the manifest matches."

      - name: Upload the installer and update files as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: understudy-${{ steps.meta.outputs.version }}-arm64
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.zip.blockmap
            packages/app/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The DMG is for people. The zip, its blockmap, and latest-mac.yml are
          # what installed copies read to update themselves. The names carry no
          # spaces on purpose: GitHub rewrites spaces to dots on upload, while
          # the updater requests whatever the manifest says, verbatim.
          assets=(
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.zip.blockmap
            packages/app/release/latest-mac.yml
          )
          if [ ${#assets[@]} -ne 4 ]; then
            echo "::error::expected dmg, zip, zip.blockmap, and latest-mac.yml in packages/app/release; found: ${assets[*]:-nothing}" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] || { echo "::error::missing release asset $asset" >&2; exit 1; }
          done

          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ### Install

          Apple Silicon (arm64) only.

          Download the `.dmg` below, open it, and drag **Understudy** to Applications.

          Both the disk image and the app inside are signed with a Developer ID
          certificate and notarized by Apple, so they open without any Gatekeeper
          workaround. The app runs in the menu bar and has no Dock icon.

          **Already installed?** Nothing to do. Copies from 0.1.5 on, whether they
          were installed as Workspace Agent or as Understudy, update themselves:
          the app downloads new versions in the background and
          offers **Restart to Update** from its menu bar icon. The `.zip` and
          `latest-mac.yml` below are what it reads; you don't need them.

          ---
          NOTES

          gh release create "$TAG" \
            --title "Understudy $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${assets[@]}"

          echo "::notice::Published $TAG with ${#assets[@]} asset(s)"
