<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Workspace Agent app icon: a speech bubble with a terminal prompt, broadcasting a signal">
  <title>Workspace Agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16929d"/>
      <stop offset="0.55" stop-color="#0e7c86"/>
      <stop offset="1" stop-color="#095b63"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1024" height="1024" rx="184" fill="url(#bg)"/>

  <!-- signal arcs radiating from the bubble's shoulder -->
  <g fill="none" stroke="#a7e6ec" stroke-width="40" stroke-linecap="round">
    <path d="M 790 230 A 70 70 0 0 1 860 300"/>
    <path d="M 790 166 A 134 134 0 0 1 924 300"/>
  </g>
  <circle cx="790" cy="300" r="32" fill="#ffffff"/>

  <!-- speech bubble -->
  <rect x="180" y="330" width="580" height="400" rx="100" fill="#ffffff"/>
  <path d="M 292 726 C 288 792, 246 844, 186 868 C 292 852, 362 800, 396 728 Z" fill="#ffffff"/>

  <!-- terminal prompt -->
  <polyline points="330,460 430,545 330,630" fill="none" stroke="#0e7c86" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="592" width="150" height="52" rx="26" fill="#0e7c86"/>
</svg>
