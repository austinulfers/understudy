name: Release macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never cancel a run mid-upload; a half-published release is worse than a queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # arm64 runner. The app only targets mac arm64 (see packages/app/package.json -> build.mac.target).
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node so that `cache: pnpm` can find the store.
      # No `version:` input — it reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fail before the 5-minute build rather than after, and name exactly what
      # is missing. Signing is not optional: an unsigned DMG will not launch on
      # anyone else's Mac, so there is no useful degraded mode to fall back to.
      - name: Preflight — check signing secrets
        # Named after the secrets, not the env vars they later map to, so the
        # error message says something you can act on in the settings UI.
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets for code signing: ${missing[*]}. See docs/RELEASING.md for how to create and set them."
            exit 1
          fi
          echo "All signing secrets present."

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Resolve version
        id: meta
        run: |
          version=$(node -p "require('./packages/app/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Check whether this version was already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists — building to verify, but not publishing. Bump the version in packages/app/package.json to cut a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # @electron/notarize wants a *path* to the .p8, not its contents.
      - name: Stage App Store Connect API key
        id: asc
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize DMG
        env:
          # electron-builder imports this into a throwaway keychain itself.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Presence of these three is what switches notarization on.
          APPLE_API_KEY: ${{ steps.asc.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm --filter workspace-agent-app build
          pnpm --filter workspace-agent-app exec electron-builder --mac --publish never

      - name: Shred API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"

      # Catches the failure mode where the build "succeeds" but produces
      # something Gatekeeper will still reject on a user's machine.
      - name: Verify signature, entitlements, and stapled ticket
        run: |
          set -euo pipefail
          app="packages/app/release/mac-arm64/Workspace Agent.app"

          echo "::group::codesign --verify"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "::endgroup::"

          echo "::group::signing authority"
          codesign -dvvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags="
          echo "::endgroup::"

          echo "::group::entitlements"
          codesign -d --entitlements :- "$app"
          echo "::endgroup::"

          # Hardened runtime must be on, or notarization would not have passed.
          codesign -dvvv "$app" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime is not enabled on the signed app"; exit 1; }

          # The stapled ticket is what lets the app launch on a Mac that has
          # never seen it before, even offline. Without it users still get
          # blocked, notarization or not.
          echo "::group::stapler validate"
          xcrun stapler validate "$app"
          echo "::endgroup::"

          # Final end-to-end check: this is the exact question Gatekeeper asks.
          echo "::group::spctl assess"
          spctl --assess --type execute --verbose=4 "$app"
          echo "::endgroup::"

          echo "Signed, notarized, and stapled."

      - name: Upload DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-agent-${{ steps.meta.outputs.version }}-arm64-dmg
          path: packages/app/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(packages/app/release/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no .dmg in packages/app/release" >&2
            exit 1
          fi

          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ### Install

          Apple Silicon (arm64) only.

          Download the `.dmg` below, open it, and drag **Workspace Agent** to Applications.

          This build is signed with a Developer ID certificate and notarized by Apple,
          so it launches without any Gatekeeper workaround. The app runs in the menu
          bar and has no Dock icon.

          ---
          NOTES

          gh release create "$TAG" \
            --title "Workspace Agent $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${dmgs[@]}"

          echo "::notice::Published $TAG with ${#dmgs[@]} asset(s)"
