<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 44 44" width="44" height="44">
  <!-- macOS template image: black + alpha only; the system recolors it.
       Rendered at 22px and 44px, so the gap, eyes, and smile are a little
       heavier than in the logo or they would vanish. -->
  <defs>
    <path id="bubble" d="M0 95 L0 210 C0 248 20 258 20 275 L18 308 C16 322 13 334 7 343 C33 343 63 330 88 305 L245 305 A95 95 0 0 0 340 210 L340 95 A95 95 0 0 0 245 0 L95 0 A95 95 0 0 0 0 95 Z"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="277" y="0" width="540" height="500">
      <rect x="277" y="0" width="540" height="500" fill="#fff"/>
      <use xlink:href="#bubble" transform="translate(317 111)" fill="#000" stroke="#000" stroke-width="64" stroke-linejoin="round"/>
    </mask>
    <mask id="face" maskUnits="userSpaceOnUse" x="277" y="0" width="540" height="500">
      <rect x="277" y="0" width="540" height="500" fill="#fff"/>
      <rect x="392" y="192" width="42" height="84" rx="21" fill="#000"/>
      <rect x="540" y="192" width="42" height="84" rx="21" fill="#000"/>
      <path d="M451 310 Q487 336 523 310" fill="none" stroke="#000" stroke-width="30" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- the mark, 460x414 in its own coordinates, scaled to 20x18 points -->
  <g transform="translate(22 22) scale(0.087) translate(-547 -247)" fill="#000">
    <g mask="url(#gap)">
      <use xlink:href="#bubble" transform="translate(777 40) scale(-1 1)"/>
    </g>
    <g mask="url(#face)">
      <use xlink:href="#bubble" transform="translate(317 111)"/>
    </g>
  </g>
</svg>
